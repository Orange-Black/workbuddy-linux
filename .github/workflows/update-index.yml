name: Update version index

on:
  schedule:
    # 每天 03:17 UTC（北京时间 11:17）自动刷新一次
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 查询官方接口并生成 index.json
        run: ./scripts/update-index.sh

      - name: 提交变更
        run: |
          if git diff --quiet -- index.json; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: 更新版本索引 $(date -u +%Y-%m-%d)"
          git push

      - name: 上游有新版本时创建 Release（只放直链，不附带二进制）
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh
