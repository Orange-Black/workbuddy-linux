name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck -S style install.sh scripts/*.sh

      - name: 语法检查
        run: |
          for f in install.sh scripts/*.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
